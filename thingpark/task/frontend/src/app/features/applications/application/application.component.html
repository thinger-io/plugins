
<form nz-form [formGroup]="applicationForm" (ngSubmit)="onSubmit()">

  <!-- Application Server ID (AS_ID) -->
  <nz-form-item>
    <nz-form-label
      [nzSpan]="8"
      [nzXs]="26"
      nzFor="applicationId"
      nzTooltipTitle="The AS_ID of your ThingPark Application Server (e.g. TWA_100082957.695171.AS). Found in your ThingPark console under Application Servers. This value is sent by ThingPark in the AS_ID query parameter of every uplink."
      nzRequired
    >
      Application Server ID
    </nz-form-label>
    <nz-form-control [nzSpan]="12" [nzXs]="26" nzHasFeedback>
      <input nz-input formControlName="applicationId" name="applicationId" type="text" id="applicationId" placeholder="e.g. TWA_100082957.695171.AS" />
    </nz-form-control>
  </nz-form-item>

  <!-- Display Name -->
  <nz-form-item>
    <nz-form-label
      [nzSpan]="8"
      [nzXs]="26"
      nzFor="applicationName"
      nzTooltipTitle="Human-readable name for this routing profile configuration"
    >
      Display Name
    </nz-form-label>
    <nz-form-control [nzSpan]="12" [nzXs]="26" nzHasFeedback>
      <input nz-input formControlName="applicationName" name="applicationName" type="text" id="applicationName" placeholder="Optional display name" />
    </nz-form-control>
  </nz-form-item>

  <!-- Device Id Prefix -->
  <nz-form-item>
    <nz-form-label
      [nzSpan]="8"
      [nzXs]="26"
      nzFor="deviceIdPrefix"
      nzTooltipTitle="Prefix prepended to the device EUI to form the Thinger.io device ID (used for auto-provisioning via Products)"
      nzRequired
    >
      Device Id Prefix
    </nz-form-label>
    <nz-form-control [nzSpan]="12" [nzXs]="26" nzHasFeedback [nzErrorTip]="errorPrefixField">
      <input nz-input formControlName="deviceIdPrefix" name="deviceIdPrefix" type="text" id="deviceIdPrefix" placeholder="Ex: thingpark_" />
      <ng-template #errorPrefixField let-control>
        @if (control.errors?.['prefixUnique']) {
          The Device Id Prefix must be unique
        }
      </ng-template>
    </nz-form-control>
  </nz-form-item>

  <!-- ThingPark Server URL -->
  <nz-form-item>
    <nz-form-label
      [nzSpan]="8"
      [nzXs]="26"
      nzFor="thingparkUrl"
      nzTooltipTitle="Base URL of your ThingPark Enterprise server. Used to send downlink messages to devices."
      nzRequired
    >
      ThingPark Server URL
    </nz-form-label>
    <nz-form-control [nzSpan]="12" [nzXs]="26" nzHasFeedback>
      <input nz-input formControlName="thingparkUrl" name="thingparkUrl" type="text" id="thingparkUrl" placeholder="https://myserver.thingpark.com" />
    </nz-form-control>
  </nz-form-item>

  <!-- Tunnel Key (optional) -->
  <nz-form-item>
    <nz-form-label
      [nzSpan]="8"
      [nzXs]="26"
      nzFor="asKey"
      nzTooltipTitle="Pre-shared 128-bit tunnel interface key (hex) for computing the SHA-256 downlink authentication token. Leave empty if AS authentication is not configured."
    >
      Tunnel Key (hex)
    </nz-form-label>
    <nz-form-control [nzSpan]="12" [nzXs]="26" nzHasFeedback>
      <input nz-input formControlName="asKey" name="asKey" type="password" id="asKey" placeholder="Optional — 128-bit key in hex" />
    </nz-form-control>
  </nz-form-item>

  <!-- Enabled -->
  <nz-form-item>
    <nz-form-label
      [nzSpan]="8"
      [nzXs]="26"
      nzFor="enabled"
      nzTooltipTitle="Enable or disable uplink processing for this routing profile"
      nzRequired
    >
      Enabled
    </nz-form-label>
    <nz-form-control [nzSpan]="12" [nzXs]="26" nzHasFeedback>
      <nz-switch formControlName="enabled"></nz-switch>
    </nz-form-control>
  </nz-form-item>

</form>
